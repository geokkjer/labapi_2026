# ═══════════════════════════════════════════════════════════
# DEV: api bygges fra din egen kode, db fra postgres:16.
# Start:  podman compose up -d
# Verifiser: curl http://localhost:8080/health
# ═══════════════════════════════════════════════════════════
name: labapi

services:
  db:
    image: docker.io/library/postgres:16
    container_name: lab-postgres
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: lab-api
    restart: unless-stopped
    # Ressursgrenser — økt 4: produksjonslik stack
    cpus: 0.50
    mem_limit: 512m
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      APP_VERSION: dev
      # default true i dev: appen migrerer databasen selv ved oppstart
      MIGRATE_ON_STARTUP: "true"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (ikke «localhost»): Kestrel binder kun IPv4 (0.0.0.0),
      #   mens localhost inne i containeren peker på ::1 først.
      # GET (ikke --spider, som sender HEAD): /health er registrert med
      #   MapGet, så HEAD gir 405 og wget melder "broken link".
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Valgfritt GUI, bak en profile: starter bare med `--profile tools`.
  # Se "Verktøy med GUI: se, men ikke klikk" i onsdagsleksjonen.
  pgadmin:
    image: docker.io/dpage/pgadmin4:9
    container_name: lab-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
